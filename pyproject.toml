[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "makelib-seo"
version = "0.1.0"
description = "A drop-in Makefile library for CI/CD pipelines that enforces Technical SEO, AI-Search readiness (GEO), and Core Web Vitals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "textstat>=0.7.3",
    "lxml>=5.0.0",
]
authors = [
    { name = "makelib maintainers" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]

[tool.setuptools.packages.find]
where = ["src"]
