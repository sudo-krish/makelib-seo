[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "makelib-seo"
version = "0.1.0"
description = "A drop-in Makefile library for CI/CD pipelines that enforces Technical SEO, AI-Search readiness (GEO), and Core Web Vitals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "textstat>=0.7.3",
    "lxml>=5.0.0",
]
authors = [
    { name = "makelib maintainers" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]

[tool.setuptools.packages.find]
where = ["."]

# ------------------------------------------------------------------------------
# Ruff Configuration (Linter, Formatter, Import Sorter, Complexity)
# ------------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4

# Exclude standard generated directories, caches, and environments
exclude = [
    ".git",
    ".makelib",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "site-packages",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C901",
    "UP",
    "S",
]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["seo_checker", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S104", "S105", "S106", "S311"]

# ------------------------------------------------------------------------------
# Mypy Configuration (Strict Static Type Checking)
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "textstat",
    "lxml",
]
ignore_missing_imports = true

# ------------------------------------------------------------------------------
# Pytest Configuration
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]

# ------------------------------------------------------------------------------
# Coverage Configuration
# ------------------------------------------------------------------------------
[tool.coverage.run]
source = ["seo_checker"]
branch = true
omit = [
    "tests/*",
    ".venv/*",
    ".makelib/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

# ------------------------------------------------------------------------------
# Bandit Security AST Scanner Configuration
# ------------------------------------------------------------------------------
[tool.bandit]
targets = ["seo_checker.py"]
exclude_dirs = ["tests", ".venv", ".makelib"]
skips = ["B101", "B310"]
